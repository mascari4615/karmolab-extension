<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>KarmoLab</title>
  <style>
    body { margin: 0; width: 320px; background: #000; color: #fff; font: 14px/1.4 "Pretendard", "Malgun Gothic", system-ui, sans-serif; color-scheme: dark; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #333; }
    header img { width: 24px; height: 24px; }
    header b { font-size: 15px; }
    label { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; }
    input { margin-top: 3px; accent-color: #fff; }
    small { display: block; color: #999; }
    footer { padding: 8px 14px 12px; }
    footer a { color: #999; text-decoration: none; font-size: 12px; }
    section { padding: 0 14px 12px; border-bottom: 1px solid #333; }
    h2 { font-size: 13px; margin: 8px 0; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 230px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #333; }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    button { background: #000; color: #fff; border: 1px solid #777; padding: 6px 10px; cursor: pointer; flex-shrink: 0; font: inherit; }
    button:hover { background: #222; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #blockStatus { margin: 8px 0; color: #bbb; font-size: 12px; }
    #base64Status { color: #bbb; font-size: 12px; overflow-wrap: anywhere; }
    #base64Site { border-radius: 4px; min-height: 36px; white-space: normal; }
    .count-settings { padding: 0 14px 14px; }
    .count-settings label { padding: 8px 0; }
    select { padding: 7px 8px; border: 1px solid #777; border-radius: 4px; background: #111; color: #fff; font: inherit; }
    #shortsCountStatus { color: #bbb; font-size: 12px; margin: 6px 0; }
  </style>
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><b>KarmoLab</b></header>
  <section aria-labelledby="base64Heading">
    <h2 id="base64Heading" data-msg="featBase64"></h2>
    <small data-msg="featBase64Hint"></small>
    <p id="base64Status" role="status" data-msg="base64Loading"></p>
    <button id="base64Site" type="button" disabled data-msg="base64Enable"></button>
  </section>
  <label>
    <input type="checkbox" id="shortsDate">
    <span><span data-msg="featShortsDate"></span><small data-msg="featShortsDateHint"></small></span>
  </label>
  <label>
    <input type="checkbox" id="userBlock" disabled>
    <span><span data-msg="featUserBlock"></span><small data-msg="featUserBlockHint"></small></span>
  </label>
  <section class="count-settings" aria-labelledby="shortsCountHeading">
    <label>
      <input type="checkbox" id="shortsCount" disabled>
      <span><span id="shortsCountHeading" data-msg="featShortsCount"></span><small data-msg="featShortsCountHint"></small></span>
    </label>
    <label for="shortsCountMode" data-msg="shortsCountDisplay"></label>
    <select id="shortsCountMode" disabled>
      <option value="both" data-msg="shortsCountModeBoth"></option>
      <option value="unique" data-msg="shortsCountModeUnique"></option>
      <option value="views" data-msg="shortsCountModeViews"></option>
    </select>
    <p id="shortsCountStatus" role="status"></p>
  </section>
  <section aria-labelledby="blockHeading">
    <h2 id="blockHeading" data-msg="blockedUsers"></h2>
    <p id="blockStatus" role="status" data-msg="blockLoading"></p>
    <ul id="blockedList"></ul>
  </section>
  <footer><a href="https://lab.mascari4615.com/" target="_blank" data-msg="popupFooter"></a></footer>
  <script src="popup.js"></script>
</body>
</html>
