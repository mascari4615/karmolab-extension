<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>KarmoLab</title>
  <style>
    body { margin: 0; width: 320px; max-width: 100%; box-sizing: border-box; background: #000; color: #fff; font: 14px/1.4 "Pretendard", "Malgun Gothic", system-ui, sans-serif; color-scheme: dark; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #333; }
    header img { width: 24px; height: 24px; }
    header b { font-size: 15px; }
    label { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; }
    input { margin-top: 3px; accent-color: #fff; }
    small { display: block; color: #999; }
    footer { padding: 8px 14px 12px; }
    footer a { color: #999; text-decoration: none; font-size: 12px; }
    section { padding: 0 14px 12px; border-bottom: 1px solid #333; }
    h2 { font-size: 13px; margin: 8px 0; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 230px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #333; }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    button { background: #000; color: #fff; border: 1px solid #777; padding: 6px 10px; cursor: pointer; flex-shrink: 0; font: inherit; }
    button:hover { background: #222; }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #blockStatus { margin: 8px 0; color: #bbb; font-size: 12px; }
    #base64Status { color: #bbb; font-size: 12px; overflow-wrap: anywhere; }
    #base64Site { border-radius: 4px; min-height: 36px; white-space: normal; }
    .count-settings { padding: 0 14px 14px; }
    .count-settings label { padding: 8px 0; }
    .count-settings label:has(input) { min-height: 28px; align-items: center; }
    select { max-width: 100%; padding: 7px 8px; border: 1px solid #777; border-radius: 4px; background: #111; color: #fff; font: inherit; }
    #shortsCountStatus { color: #bbb; font-size: 12px; margin: 6px 0; }
    .utility { padding-top: 12px; }
    .utility label { padding: 8px 0; min-height: 28px; align-items: center; }
    .utility p { font-size: 12px; color: #bbb; margin: 8px 0; overflow-wrap: anywhere; }
    .volume-row { display: flex; align-items: center; gap: 8px; }
    .volume-row input[type="range"] { flex: 1; min-width: 0; min-height: 36px; accent-color: #fff; }
    input[type="number"] { width: 55px; padding: 6px; background: #111; color: #fff; border: 1px solid #777; font: inherit; }
    #dcinsideGalleryInput { flex: 1; min-width: 120px; background: #111; color: #fff; border: 1px solid #777; padding: 6px; font: inherit; }
    .utility button { border-radius: 4px; min-height: 36px; }
    .utility .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    textarea { width: 100%; box-sizing: border-box; min-height: 80px; padding: 8px; border: 1px solid #777; border-radius: 4px; background: #111; color: #fff; font: inherit; resize: vertical; }
    @media (pointer: coarse) { .utility button, .volume-row input, .volume-row input[type="range"] { min-height: 44px; } }
  </style>
  <link rel="stylesheet" href="features/settings-shell.css">
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><b>KarmoLab</b></header>
  <section class="utility" aria-labelledby="darkModeHeading">
    <h2 id="darkModeHeading" data-msg="darkModeHeading"></h2>
    <p id="darkModeStatus" role="status" data-msg="base64Loading"></p>
    <button id="darkModeSite" type="button" disabled data-msg="darkModeEnable"></button>
    <p data-msg="darkModeHint"></p>
  </section>
  <section class="utility" aria-labelledby="volumeHeading">
    <h2 id="volumeHeading" data-msg="volumeHeading"></h2>
    <div class="volume-row"><input id="siteVolumeRange" type="range" min="0" max="300" step="5" value="100" disabled data-msg-label="volumeValue"><input id="siteVolumeNumber" type="number" min="0" max="300" step="1" value="100" disabled data-msg-label="volumeValue"><span>%</span></div>
    <p id="volumeStatus" role="status" data-msg="volumeLoading"></p>
    <div class="actions"><button id="volumeApply" type="button" disabled data-msg="volumeApply"></button><button id="volumeStop" type="button" hidden data-msg="volumeStop"></button></div>
    <p data-msg="volumeHint"></p>
  </section>
  <section aria-labelledby="base64Heading">
    <h2 id="base64Heading" data-msg="featBase64"></h2>
    <small data-msg="featBase64Hint"></small>
    <p id="base64Status" role="status" data-msg="base64Loading"></p>
    <button id="base64Site" type="button" disabled data-msg="base64Enable"></button>
  </section>
  <section aria-labelledby="arcaHeading">
    <h2 id="arcaHeading">아카라이브</h2>
    <p id="arcaStatus" role="status">설정 확인 중...</p>
    <button id="arcaToggle" type="button" disabled>아카라이브 켜기</button>
    <button id="arcaManage" type="button" disabled>차단과 팔로우 관리</button>
    <p>켜거나 끈 뒤에는 열린 아카라이브 탭을 새로고침하세요. 저장된 목록은 유지됩니다.</p>
  </section>
  <section class="utility" aria-labelledby="dcinsideHeading">
    <h2 id="dcinsideHeading">디시인사이드</h2>
    <p id="dcinsideStatus" role="status"></p>
    <div class="actions">
      <button id="dcinsideToggle" type="button" disabled>디시인사이드 켜기</button>
      <button id="dcinsideKeywords" type="button">공통 키워드 편집</button>
    </div>
    <p>작성자 자동 차단을 켠 공통 키워드가 글 제목에 있으면 작성자도 차단 목록에 추가됩니다.</p>
    <h3>갤러리 차단</h3>
    <form id="dcinsideGalleryForm" class="actions">
      <input type="text" id="dcinsideGalleryInput" placeholder="갤러리 URL 또는 ID" aria-label="갤러리 URL 또는 ID" required>
      <button type="submit">갤러리 차단</button>
    </form>
    <button id="dcinsideCurrentGallery" type="button" hidden>현재 갤러리 차단</button>
    <ul id="dcinsideGalleries" aria-label="차단된 디시인사이드 갤러리"></ul>
    <h3>작성자 차단</h3>
    <ul id="dcinsideBlocks" aria-label="차단된 디시인사이드 작성자"></ul>
  </section>
  <section id="keywordsSection" class="utility" aria-label="공통 키워드">
    <p data-msg="keywordWordsLabel"></p>
    <textarea id="keywordText" hidden></textarea>
    <div id="keywordEditor"></div>
    <div class="actions">
      <button id="keywordSave" type="button" disabled data-msg="keywordSave"></button>
      <button id="keywordDiscard" type="button" hidden>초안 버리기</button>
    </div>
    <p id="keywordStatus" role="status"></p>
    <h3>동기화</h3>
    <label><input id="keywordSync" type="checkbox" disabled> 같은 브라우저 계정으로 키워드 동기화</label>
    <p>같은 확장에서 키워드와 작성자 자동 차단 설정을 공유합니다. 처음 켤 때 두 목록을 합칩니다.</p>
    <p id="keywordSyncStatus" role="status"></p>
  </section>
  <footer><a href="https://lab.mascari4615.com/" target="_blank" data-msg="popupFooter"></a></footer>
  <script src="features/keyword-core.js"></script>
  <script src="features/control-icons.js"></script>
  <script src="features/keyword-editor.js"></script>
  <script src="features/auto-block-exceptions.js"></script>
  <script src="features/dcinside/gallery.js"></script>
  <script src="features/settings-navigation.js"></script>
  <script src="features/popup-navigation.js"></script>
  <script src="popup.js"></script>
  <script type="module" src="features/volume-popup.mjs"></script>
  <script type="module" src="features/dark-mode-popup.mjs"></script>
  <script type="module" src="features/arca/popup.mjs"></script>
  <script type="module" src="features/dcinside/popup.mjs"></script>
  <script type="module" src="features/keyword-popup.mjs"></script>
</body>
</html>
